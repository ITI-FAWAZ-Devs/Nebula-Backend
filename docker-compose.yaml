version: "3.9"

services:
  postgres:
    image: postgres:18
    container_name: nebula-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nebula

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nebula"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: